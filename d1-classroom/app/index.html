<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:;"><title>D1 學生工坊</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>D1 學生工坊</strong><span>初中機器狗編程</span></div><div class="connect"><button id="scan" class="primary">掃描機器狗</button><button id="disconnect" disabled>斷開</button><span id="status">未連接</span><span id="battery">電量 —</span></div></header>
<section id="devices" hidden aria-label="選擇自己的機器狗"><div class="device-heading"><h2>選擇自己的機器狗</h2><span id="scan-status" role="status"></span></div><p>核對機身標籤上的完整 MAC，再點「連線」。</p><div id="robot-list"></div></section>
<nav><label><input type="checkbox" id="practice" checked> 練習模式</label><button id="run" class="primary">▶ 運行</button><button id="stop" class="danger">■ 停止</button><label>課程範例 <select id="lesson"></select></label><button id="load">載入</button><button id="tutorial">本課教程 ↗</button><button id="save">保存專案</button><button id="open">開啟專案</button></nav>
<div id="notice" role="status">練習模式只記錄指令，不會讓機器狗運動。實機測試前請取得老師示意。</div>
<main><section class="editor"><div class="sectionbar"><div class="modes"><button data-mode="blocks" class="active">積木</button><button data-mode="split">積木與 Python</button><button data-mode="python">Python</button></div><button id="generated">用積木更新 Python</button></div><div id="editors"><div id="blockly"></div><div id="textwrap"><label for="code">Python 程式 <span id="code-state">與積木一致</span></label><textarea id="code" spellcheck="false" aria-label="Python 程式"></textarea><small>文字可自行修改；修改後會保留原積木。按「用積木更新 Python」會覆蓋文字。</small></div></div></section>
<aside><h2>相機與圖像分類</h2><div class="row"><button id="robot-camera">機器狗相機</button><button id="pc-camera">電腦相機</button><button id="camera-off">關閉</button></div><canvas id="camera" width="640" height="480"></canvas><video id="video" autoplay muted playsinline hidden></video><div id="camera-state">相機未開啟</div><div class="row"><button id="capture">保存圖片</button><label class="filebutton">開啟測試圖片<input type="file" id="image-input" accept="image/*"></label></div><label class="filebutton green">匯入 TensorFlow.js ZIP<input type="file" id="model-input" accept=".zip"></label><div id="model-state">尚未匯入模型</div><div id="predictions"></div><p class="hint">確認條件：同一類連續 3 張新畫面，信心分數 ≥ 0.80。靜態圖片只用於測試。</p></aside></main>
<section id="output"><div class="sectionbar"><h2>運行記錄</h2><button id="clear">清除記錄</button></div><pre id="log" aria-live="polite"></pre></section>
<script src="renderer.bundle.js"></script></body></html>
