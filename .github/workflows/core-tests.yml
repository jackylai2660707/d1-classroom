name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repository checks
        run: python scripts/check_repository.py
      - name: JavaScript and fake SDK integration
        run: node --test d1-classroom/tests/*.test.cjs
      - name: Python bridge and installer
        run: python -m unittest discover -s d1-classroom/tests -p '*_test.py'
